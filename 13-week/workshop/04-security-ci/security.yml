# Proposal for csp-booking-api (not applied to the team repository).
# Three security gates on every pull request: secret scan, dependency audit, authorization tests.
name: security

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Dependency audit (OWASP dependency-check, fail on CVSS 7 or higher)
        run: mvn -B org.owasp:dependency-check-maven:10.0.4:check -DfailBuildOnCVSS=7

  authorization-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Authorization tests of booking-adapters
        run: >
          mvn -B -pl booking-adapters -am test
          -Dtest='JwtAuthenticationFilterTest,ForgedWorkflowTokenAuthzTest'
          -Dsurefire.failIfNoSpecifiedTests=false
